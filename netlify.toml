[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Cache fonts for a year (filenames change when Webflow re-exports them)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# TESTING ONLY: tells search engines not to index any page while this site is used for testing.
# Delete this block when the site launches on madeclearstudios.com.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
